<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Иконка сайта -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />

    <!-- iPhone / iPad -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Android / Chrome / другие браузеры -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Название -->
    <title>Расписание</title>
    <meta name="application-name" content="Расписание" />
    <meta name="apple-mobile-web-app-title" content="Расписание" />

    <!-- Запуск как приложение -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="theme-color" content="#0f0f0f" />

    <!-- Предпросмотр ссылок -->
    <meta property="og:title" content="Расписание" />
    <meta property="og:image" content="/icon-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Расписание" />
    <meta name="twitter:image" content="/icon-512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
