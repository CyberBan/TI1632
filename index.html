<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Основная иконка сайта -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Иконка для iPhone / iPad -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Название приложения -->
    <title>Расписание</title>
    <meta name="application-name" content="Расписание" />
    <meta name="apple-mobile-web-app-title" content="Расписание" />

    <!-- Режим приложения на iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Android / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f0f0f" />

    <!-- Предпросмотр ссылки -->
    <meta property="og:title" content="Расписание" />
    <meta property="og:description" content="Расписание учебных занятий" />
    <meta property="og:image" content="/icon-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Расписание" />
    <meta
      name="twitter:description"
      content="Расписание учебных занятий"
    />
    <meta name="twitter:image" content="/icon-512.png" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
